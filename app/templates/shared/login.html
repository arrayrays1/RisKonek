<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --rk-green: #10b981;
            --rk-green-mid: #059669;
            --rk-green-dark: #047857;
        }

        html, body {
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Background — uses photo if available, falls back to gradient */
        body {
            background: linear-gradient(160deg, #ecfdf5 0%, #f4f6f9 45%, #e8f4fd 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 24px; position: relative; overflow-x: hidden;
        }

        .bg-photo {
            position: fixed; inset: 0; z-index: 0;
            background-image: url('/static/img/login-bg.jpg');
            background-size: cover; background-position: center;
            filter: brightness(0.55);
        }
        .bg-photo-overlay {
            position: fixed; inset: 0; z-index: 0;
            background: rgba(0,0,0,0.25);
        }

        /* Fallback blobs when no photo */
        .bg-blob::before, .bg-blob::after {
            content: ''; position: fixed; border-radius: 50%;
            filter: blur(60px); opacity: 0.35; z-index: 0;
        }
        .bg-blob::before {
            width: 420px; height: 420px;
            background: var(--rk-green); top: -120px; left: -120px;
        }
        .bg-blob::after {
            width: 480px; height: 480px;
            background: #2980b9; bottom: -160px; right: -140px;
        }

        /* Card shell */
        .login-shell {
            position: relative; z-index: 1;
            width: 100%; max-width: 860px;
            background: white; border-radius: 20px;
            box-shadow: 0 20px 60px rgba(16,24,40,0.22);
            display: flex; overflow: hidden; min-height: 500px;
        }

        /* Left brand panel */
        .login-brand {
            flex: 0 0 44%;
            background: linear-gradient(160deg, var(--rk-green-mid) 0%, var(--rk-green-dark) 100%);
            color: white; padding: 48px 40px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .login-brand .emblem {
            width: 90px; height: 90px; background: white;
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; margin-bottom: 24px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.18); overflow: hidden;
        }
        .login-brand .emblem img  { width: 80px; height: 80px; object-fit: contain; }
        .login-brand .emblem i    { font-size: 38px; color: var(--rk-green-dark); }
        .login-brand h1 {
            font-size: 26px; font-weight: 800; margin: 0 0 6px; line-height: 1.25;
        }
        .login-brand h1 .accent { color: #fbbf24; }
        .login-brand .tagline    { font-size: 14px; color: rgba(255,255,255,0.85); margin-bottom: 28px; }
        .login-brand .divider    { border-top: 1px solid rgba(255,255,255,0.25); margin-bottom: 20px; }
        .login-brand .footer-loc { font-size: 13px; font-weight: 700; }
        .login-brand .footer-off { font-size: 12px; color: rgba(255,255,255,0.7); }

        /* Right form panel */
        .login-form-panel {
            flex: 1; padding: 48px 44px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .login-form-panel h3  { font-size: 22px; font-weight: 700; margin-bottom: 4px; color: #1a1a2e; }
        .login-form-panel .subtext { font-size: 13px; color: #6c757d; margin-bottom: 28px; }

        /* Form label */
        .f-label {
            display: block; font-size: 13px; font-weight: 600;
            color: #374151; margin-bottom: 6px;
        }

        /* Input group */
        .f-group {
            display: flex; align-items: center;
            border: 1.5px solid #d1d5db; border-radius: 10px;
            overflow: hidden; margin-bottom: 18px; background: white;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .f-group:focus-within {
            border-color: var(--rk-green);
            box-shadow: 0 0 0 3px rgba(16,185,129,0.12);
        }
        .f-group .f-icon {
            padding: 11px 12px; color: #9ca3af; background: white;
            border: none; flex-shrink: 0; font-size: 15px; line-height: 1;
        }
        .f-group input {
            border: none; outline: none; padding: 11px 6px;
            font-size: 14px; color: #1a1a2e; flex: 1; background: transparent;
            width: 100%;
        }
        .f-group .toggle-pw {
            padding: 11px 12px; background: white; border: none;
            color: #9ca3af; cursor: pointer; font-size: 15px; line-height: 1;
        }
        .f-group .toggle-pw:hover { color: #6b7280; }

        /* Role select */
        .f-select-wrap {
            display: flex; align-items: center;
            border: 1.5px solid #d1d5db; border-radius: 10px;
            overflow: hidden; margin-bottom: 18px; background: white;
            transition: border-color 0.15s;
        }
        .f-select-wrap:focus-within { border-color: var(--rk-green); box-shadow: 0 0 0 3px rgba(16,185,129,0.12); }
        .f-select-wrap select {
            border: none; outline: none; padding: 11px 12px;
            font-size: 14px; color: #1a1a2e; flex: 1;
            background: transparent; cursor: pointer; appearance: auto;
        }

        /* Login button */
        .btn-login {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, var(--rk-green), var(--rk-green-dark));
            color: white; border: none; border-radius: 10px;
            font-weight: 600; font-size: 15px; cursor: pointer;
            box-shadow: 0 4px 14px rgba(4,120,87,0.3);
            transition: opacity 0.15s;
        }
        .btn-login:hover { opacity: 0.92; }

        /* Error alert */
        .f-error {
            display: flex; align-items: flex-start; gap: 8px;
            background: #fef2f2; border: 1px solid #fecaca;
            border-radius: 10px; padding: 10px 14px;
            font-size: 13px; color: #991b1b; margin-bottom: 18px;
        }

        /* Forgot password */
        .forgot-pw {
            display: block; text-align: right; font-size: 12.5px;
            color: var(--rk-green); text-decoration: none; margin-bottom: 20px;
            cursor: default;
        }

        @media (max-width: 680px) {
            .login-shell { flex-direction: column; min-height: auto; }
            .login-brand { padding: 36px 28px; }
            .login-form-panel { padding: 36px 28px; }
        }
    </style>
</head>
<body class="bg-blob">

    <!-- Background photo (shown if file exists, hidden otherwise via onerror) -->
    <div class="bg-photo" id="bgPhoto"></div>

    <div class="login-shell">

        <!-- ── Left brand panel ─────────────────────────────────── -->
        <div class="login-brand">
            <div class="emblem">
                <img src="/static/img/RisKonek-Logo-v1.png"
                     alt="RisKonek logo"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <i class="bi bi-shield-fill-check" style="display:none;"></i>
            </div>
            <h1>Welcome to <span class="accent">RisKonek</span></h1>
            <div class="tagline">Disaster Resource Management System</div>
            <div class="divider"></div>
            <div class="footer-loc">San Pedro, Laguna</div>
            <div class="footer-off">City Disaster Risk Reduction Management Office</div>
        </div>

        <!-- ── Right form panel ─────────────────────────────────── -->
        <div class="login-form-panel">
            <h3>Login to your account</h3>
            <div class="subtext">Enter your credentials to access the system</div>

            {% if error %}
            <div class="f-error">
                <i class="bi bi-exclamation-triangle-fill" style="flex-shrink:0;margin-top:1px;"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/login">
                <input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token', '') }}">

                <!-- Role selector -->
                <label class="f-label">Login as</label>
                <div class="f-select-wrap">
                    <select name="role_hint" aria-label="Login role">
                        <option value="admin">Admin (CDRRMO/LGL)</option>
                        <option value="bdrrmo">BDRRMO / Barangay Focal</option>
                        <option value="cfau">CFAU / Operations</option>
                        <option value="staff">CDRRMO Logistics Staff</option>
                    </select>
                </div>

                <!-- Username -->
                <label class="f-label">Username</label>
                <div class="f-group">
                    <span class="f-icon"><i class="bi bi-person-fill"></i></span>
                    <input type="text" name="username" placeholder="username"
                           required autofocus autocomplete="username">
                </div>

                <!-- Password -->
                <label class="f-label">Password</label>
                <div class="f-group">
                    <span class="f-icon"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" name="password" id="pwInput"
                           placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="toggle-pw" id="togglePw" tabindex="-1" aria-label="Show password">
                        <i class="bi bi-eye" id="togglePwIcon"></i>
                    </button>
                </div>

                <span class="forgot-pw"
                      title="Account recovery isn't available yet — please contact your system administrator.">
                    Forgot your password? Contact your administrator
                </span>

                <button type="submit" class="btn-login">Login</button>
            </form>
        </div>
    </div>

    <script nonce="{{ request.state.csp_nonce }}">
        // Password toggle
        (function () {
            var btn   = document.getElementById('togglePw');
            var input = document.getElementById('pwInput');
            var icon  = document.getElementById('togglePwIcon');
            btn.addEventListener('click', function () {
                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
            });
        })();

        // Background photo — hide div if image fails to load
        (function () {
            var div = document.getElementById('bgPhoto');
            var img = new Image();
            img.onload  = function () { div.style.display = 'block'; document.body.classList.remove('bg-blob'); };
            img.onerror = function () { div.style.display = 'none'; };
            img.src = '/static/img/login-bg.jpg';
        })();
    </script>
</body>
</html>
