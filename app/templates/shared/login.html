<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="preload" href="/static/fonts/InterVariable-latin.woff2" as="font" type="font/woff2" crossorigin>
    {# Shared tokens, font, focus ring and form-control outlines #}
    <link rel="stylesheet" href="/static/css/rk.css">
    <style nonce="{{ request.state.csp_nonce }}">
        :root {
            --login-brand-end: #0B481F;
        }
        html, body {
            min-height: 100vh;
            font-family: var(--rk-font);
        }
        body {
            background: linear-gradient(160deg, #ecfdf5 0%, #f4f6f9 45%, #e8f4fd 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }
        /* Soft abstract decoration in place of a photo backdrop */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            z-index: 0;
        }
        body::before {
            width: 420px; height: 420px;
            background: var(--rk-green);
            top: -120px; left: -120px;
        }
        body::after {
            width: 480px; height: 480px;
            background: #2980b9;
            bottom: -160px; right: -140px;
        }

        .login-shell {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 920px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(16,24,40,0.16);
            display: flex;
            overflow: hidden;
            min-height: 520px;
        }

        /* ── Left brand panel ─────────────────────────────────────── */
        .login-brand {
            flex: 1 1 46%;
            background: linear-gradient(160deg, var(--rk-green) 0%, var(--login-brand-end) 100%);
            color: white;
            padding: 48px 40px;
            display: flex; flex-direction: column; justify-content: center;
            text-align: center;
            position: relative;
        }
        .login-brand .emblem {
    
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 28px;
        }
        .login-brand .emblem i {
            font-size: 2.375rem;
            color: var(--login-brand-end);
        }
        .login-brand .emblem img {
            width: 150px; height: 150px;
            object-fit: contain;
        }
        .login-brand h1 {
            font-size: 2.5rem; font-weight: 600; margin: 0 0 6px;
            line-height: 1.25;
        }
        .login-brand .accent { color: #FFE18F; font-size: 1.25rem; }
        .login-brand .tagline {
            font-size: var(--rk-fs-small); color: #ffffff;
            margin-bottom: 28px;
        }
        .divider {
            border-left: 1px solid rgb(160, 160, 160);
        }
        .login-brand .footer-loc {
            font-size: var(--rk-fs-small); font-weight: 700;
        }
        .login-brand .footer-office {
            font-size: var(--rk-fs-small); color: #ffffff;
        }

        /* ── Right form panel ─────────────────────────────────────── */
        .login-form-panel {
            flex: 1 1 54%;
            padding: 48px 44px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .login-form-panel-texts {
            text-align: center;
        }
        .login-form-panel h2 {
            font-size: 2.1875rem; font-weight: 700; margin-bottom: 4px; line-height: 1.2;
            color: var(--rk-green);
        }
        .login-form-panel .subtext {
            font-size: var(--rk-fs-body); color: var(--rk-muted); margin-bottom: 26px;
        }
        .form-label-rk {
            font-size: var(--rk-fs-small); font-weight: 600; margin-bottom: 6px; display: block;
        }
        .input-group-rk {
            margin-bottom: 18px;
        }
        .input-group-rk .input-group-text {
            background: white; color: var(--rk-muted);
            border-radius: 10px 10px 10px 10px;
        }
        .input-group-rk .form-control {
            border-left: 0; border-radius: 0 10px 10px 0; padding: 11px 12px;
        }
        .input-group-rk .toggle-pw {
            background: white; border-left: 0; color: var(--rk-muted); cursor: pointer;
        }
        .forgot-pw {
            font-size: var(--rk-fs-small); color: var(--rk-muted); text-decoration: none;
            cursor: default;
        }
        .btn-login {
            background: var(--rk-green);
            color: white; border: none; border-radius: 10px;
            padding: 12px; font-weight: 600; font-size: 1rem;
            box-shadow: 0 4px 14px rgba(4,120,87,0.3);
            transition: background 0.2s ease;
        }
        .btn-login:hover { color: white; background: var(--rk-green-hover); }
        #san-pedro-logo {
            width: 50px; height: 50px;
            object-fit: contain;
        }
        #cdrrmo-logo {
            height: 50px;
            width: 80px;
        }
        .san-pedro-text {
            color: #01349A;
            font-size: var(--rk-fs-small);
            font-weight: 500;
            line-height: 1.3;
        }
        @media (max-width: 760px) {
            .login-shell { flex-direction: column; min-height: auto; }
            .login-brand { padding: 36px 32px; }
        }
        @media (max-width: 480px) {
            body { padding: 12px; }
            .login-brand { padding: 28px 20px; }
            .login-brand .emblem img { width: 110px; height: 110px; }
            .login-form-panel { padding: 28px 20px; }
            .login-form-panel h2 { font-size: 1.75rem; }
        }
    </style>
</head>
<body>
    <div class="login-shell">
        <div class="login-brand">
            <div class="emblem"><img src="/static/img/Riskonek-Logo-v2.png" alt="RisKonek logo"></div>
            <h1>RisKonek</h1>
            <div class="tagline"><span class="accent">Actionable resilience starts here.</span></div>
        </div>

        <div class="login-form-panel">
            <div id="logo-container" class="d-flex justify-content-center pb-4">
                <div class="d-flex gap-1">
                    <img id="san-pedro-logo" src="/static/img/sanpedro-logo-transparent.png" alt="San Pedro logo">
                    <div class="d-flex align-items-center">
                        <p class="m-0 san-pedro-text">City of San Pedro <br> Laguna</p>
                    </div>
                    
                </div>
                <div class="divider mx-4"></div>
                <div>
                    <img id="cdrrmo-logo" src="/static/img/cdrrmo-logo-transparent.png" alt="CDRRMO logo">
                </div>
            </div>
            <div class="login-form-panel-texts">
                <h2>Magandang <br> San Pedro Po!</h2>
                <div class="subtext">Please enter your details.</div> 
            </div>


            {% if error %}
            <div class="alert alert-danger alert-dismissible fade show py-2" role="alert">
                {{ error }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endif %}

            <form method="POST" action="/login" data-validate>
                <input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token', '') }}">
                <label class="form-label-rk" for="usernameInput">Username</label>
                <div class="input-group input-group-rk">
                    <span class="input-group-text"><i class="bi bi-person-fill" aria-hidden="true"></i></span>
                    <input type="text" name="username" id="usernameInput" class="form-control"
                           placeholder="username" required autofocus autocomplete="username">
                </div>

                <label class="form-label-rk" for="pwInput">Password</label>
                <div class="input-group input-group-rk">
                    <span class="input-group-text"><i class="bi bi-lock-fill" aria-hidden="true"></i></span>
                    <input type="password" name="password" id="pwInput" class="form-control"
                           placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="input-group-text toggle-pw" id="togglePw" aria-label="Show password" aria-pressed="false">
                        <i class="bi bi-eye" id="togglePwIcon" aria-hidden="true"></i>
                    </button>
                </div>

                <div class="d-flex justify-content-end mb-3">
                    <span class="forgot-pw" title="Account recovery isn't available yet — please contact your system administrator.">
                        Forgot your password? Contact your administrator
                    </span>
                </div>

                <button type="submit" class="btn-login w-100">Login</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <script src="/static/js/rk-forms.js" nonce="{{ request.state.csp_nonce }}"></script>
    <script nonce="{{ request.state.csp_nonce }}">
        (function () {
            var btn = document.getElementById('togglePw');
            var input = document.getElementById('pwInput');
            var icon = document.getElementById('togglePwIcon');
            btn.addEventListener('click', function () {
                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
                btn.setAttribute('aria-pressed', show ? 'true' : 'false');
                btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            });
        })();
    </script>
</body>
</html>
