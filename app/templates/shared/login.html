<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <style>
        :root {
            --rk-green: #10b981;
            --rk-green-mid: #059669;
            --rk-green-dark: #047857;
        }
        html, body {
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            background: linear-gradient(160deg, #ecfdf5 0%, #f4f6f9 45%, #e8f4fd 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }
        /* Soft abstract decoration in place of a photo backdrop */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            z-index: 0;
        }
        body::before {
            width: 420px; height: 420px;
            background: var(--rk-green);
            top: -120px; left: -120px;
        }
        body::after {
            width: 480px; height: 480px;
            background: #2980b9;
            bottom: -160px; right: -140px;
        }

        .login-shell {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 920px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(16,24,40,0.16);
            display: flex;
            overflow: hidden;
            min-height: 520px;
        }

        /* ── Left brand panel ─────────────────────────────────────── */
        .login-brand {
            flex: 1 1 46%;
            background: linear-gradient(160deg, var(--rk-green-mid) 0%, var(--rk-green-dark) 100%);
            color: white;
            padding: 48px 40px;
            display: flex; flex-direction: column; justify-content: center;
            position: relative;
        }
        .login-brand .emblem {
            width: 88px; height: 88px;
            background: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.18);
            margin-bottom: 28px;
        }
        .login-brand .emblem i {
            font-size: 38px;
            color: var(--rk-green-dark);
        }
        .login-brand .emblem img {
            width: 72px; height: 72px;
            object-fit: contain;
        }
        .login-brand h1 {
            font-size: 28px; font-weight: 800; margin: 0 0 6px;
            line-height: 1.25;
        }
        .login-brand h1 .accent { color: #fbbf24; }
        .login-brand .tagline {
            font-size: 14px; color: rgba(255,255,255,0.85);
            margin-bottom: 28px;
        }
        .login-brand .divider {
            border-top: 1px solid rgba(255,255,255,0.25);
            margin-bottom: 22px;
        }
        .login-brand .footer-loc {
            font-size: 13px; font-weight: 700;
        }
        .login-brand .footer-office {
            font-size: 12px; color: rgba(255,255,255,0.7);
        }

        /* ── Right form panel ─────────────────────────────────────── */
        .login-form-panel {
            flex: 1 1 54%;
            padding: 48px 44px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .login-form-panel h3 {
            font-size: 21px; font-weight: 700; margin-bottom: 4px;
        }
        .login-form-panel .subtext {
            font-size: 13px; color: #6c757d; margin-bottom: 26px;
        }
        .form-label-rk {
            font-size: 13px; font-weight: 600; margin-bottom: 6px; display: block; color: #374151;
        }
        .input-group-rk {
            display: flex; align-items: center;
            border: 1px solid #d1d5db; border-radius: 10px;
            overflow: hidden; margin-bottom: 18px; background: white;
        }
        .input-group-rk .input-group-text {
            background: white; border: none; color: #9ca3af;
            padding: 11px 12px; flex-shrink: 0;
        }
        .input-group-rk .form-control {
            border: none; outline: none; padding: 11px 4px;
            font-size: 14px; color: #1a1a2e; flex: 1; background: transparent;
        }
        .input-group-rk:focus-within { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.1); }
        .input-group-rk .toggle-pw {
            background: white; border: none; color: #9ca3af; cursor: pointer; padding: 11px 12px;
        }
        .forgot-pw {
            font-size: 12.5px; color: #9ca3af; text-decoration: none; cursor: default;
        }
        .btn-login {
            background: linear-gradient(135deg, var(--rk-green), var(--rk-green-dark));
            color: white; border: none; border-radius: 10px; width: 100%;
            padding: 12px; font-weight: 600; font-size: 15px;
            box-shadow: 0 4px 14px rgba(4,120,87,0.3); cursor: pointer;
        }
        .btn-login:hover { color: white; background: linear-gradient(135deg, var(--rk-green-mid), var(--rk-green-dark)); }

        @media (max-width: 760px) {
            .login-shell { flex-direction: column; min-height: auto; }
            .login-brand { padding: 36px 32px; }
        }
    </style>
</head>
<body>
    <div class="login-shell">
        <div class="login-brand">
            <div class="emblem"><img src="/static/img/RisKonek-Logo-v1.png" alt="RisKonek logo"></div>
            <h1>Welcome to <span class="accent">RisKonek</span></h1>
            <div class="tagline">Disaster Resource Management System</div>
            <div class="divider"></div>
            <div class="footer-loc">San Pedro, Laguna</div>
            <div class="footer-office">City Disaster Risk Reduction Management Office</div>
        </div>

        <div class="login-form-panel">
            <h3>Login to your account</h3>
            <div class="subtext">Enter your credentials to access the system</div>

            {% if error %}
            <div class="rk-alert rk-alert-red py-2" role="alert" style="font-size:13px">
                {{ error }}
                <button type="button" class="-close" data-bs-dismiss="alert"></button>
            </div>
            {% endif %}

            <form method="POST" action="/login">
                <input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token', '') }}">
                <label class="rk-label-rk">Username</label>
                <div class="input-group-rk">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input type="text" name="username" class="rk-input"
                           placeholder="username" required autofocus autocomplete="username">
                </div>

                <label class="rk-label-rk">Password</label>
                <div class="input-group-rk">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" name="password" id="pwInput" class="rk-input"
                           placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="input-group-text toggle-pw" id="togglePw" tabindex="-1" aria-label="Show password">
                        <i class="bi bi-eye" id="togglePwIcon"></i>
                    </button>
                </div>

                <div class="flex justify-end mb-3">
                    <span class="forgot-pw" title="Account recovery isn't available yet — please contact your system administrator.">
                        Forgot your password? Contact your administrator
                    </span>
                </div>

                <button type="submit" class="btnbtn-login w-full">Login</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <script nonce="{{ request.state.csp_nonce }}">
        (function () {
            var btn = document.getElementById('togglePw');
            var input = document.getElementById('pwInput');
            var icon = document.getElementById('togglePwIcon');
            btn.addEventListener('click', function () {
                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
            });
        })();
    </script>
</body>
</html>
